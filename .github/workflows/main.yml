name: CI

on:
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-22.04
    steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-go@v3.3.0
          name: setup project
          with:
            go-version: 1.18
        
        - name: 'install'
          run: go mod download
          
        - name: 'transfer to test folder'
          run: cd test
          
        - name: 'make tests'
          run: go test
          
        - name: 'download linter'
          run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.49.0
        
        - name: 'back to root folder'
          run: ../
          
        - name: 'lint projects'
          run: golangci-lint run
